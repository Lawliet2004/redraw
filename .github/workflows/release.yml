name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
          - name: macOS Intel
            os: macos-13
            args: "--target x86_64-apple-darwin"
          - name: macOS Apple Silicon
            os: macos-14
            args: "--target aarch64-apple-darwin"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-13' && 'x86_64-apple-darwin' || matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Redraw ${{ github.ref_name }}
          releaseBody: Download the installer for your operating system below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
