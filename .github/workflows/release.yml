name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK and SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          NDK_FOUND=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_FOUND" ] && [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" --install "ndk;26.1.10909125" "platforms;android-36" "build-tools;35.0.0" || true
            NDK_FOUND=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using NDK: $NDK_FOUND"
          echo "NDK_HOME=$NDK_FOUND" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_FOUND" >> $GITHUB_ENV
          if [ -n "$SDKMANAGER" ]; then
            echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          fi
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-aarch64

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Android rust lib + APK
        run: |
          echo "NDK at: $NDK_HOME"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG=$(find "$TOOLCHAIN" -name "aarch64-linux-android*-clang" ! -name "*++" | sort -V | head -1)
          echo "Using clang: $CLANG"
          export CC_aarch64_linux_android="$CLANG"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --release
          SO="src-tauri/target/aarch64-linux-android/release/libtauri_app_lib.so"
          test -f "$SO"
          JNI="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          cp "$SO" "$JNI/libtauri_app_lib.so"
          rm -rf src-tauri/gen/android/app/src/main/assets
          mkdir -p src-tauri/gen/android/app/src/main/assets
          cp -r dist/* src-tauri/gen/android/app/src/main/assets/
          VERSION="${GITHUB_REF_NAME#v}"
          printf "tauri.android.versionCode=8\ntauri.android.versionName=%s\n" "${VERSION:-0.1.8}" > src-tauri/gen/android/app/tauri.properties
          chmod +x src-tauri/gen/android/gradlew
          REDRAW_SKIP_RUST=1 ./src-tauri/gen/android/gradlew -p src-tauri/gen/android \
            :app:assembleArm64Release -PabiList=arm64-v8a -PtargetList=aarch64

      - name: Sign APK (debug key — sideload)
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign 2>/dev/null | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KS" ]; then
            keytool -genkey -v -keystore "$KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          UNSIGNED=$(ls src-tauri/gen/android/app/build/outputs/apk/arm64/release/*-unsigned.apk | head -1)
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" redraw-android-arm64-aligned.apk
          "$APKSIGNER" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --out Redraw-android-arm64.apk redraw-android-arm64-aligned.apk
          "$APKSIGNER" verify Redraw-android-arm64.apk

      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          files: Redraw-android-arm64.apk
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | **Android** (arm64, Android 7+) | `Redraw-android-arm64.apk` |
            | Windows | NSIS `.exe` / MSI |
            | Linux | AppImage / `.deb` |
            | macOS | `.dmg` |

            ### Android install
            1. Download the APK
            2. Allow install from unknown sources for your browser/file manager
            3. Open the APK and install

            Debug-signed for sideload. iOS IPA needs a Mac + Apple signing (not in this release).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
